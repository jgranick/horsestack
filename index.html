<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A chaotic low-poly farm stacking game powered by Flight."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f3c84b'/%3E%3Cpath d='M14 45V17h9v10h18V17h9v28h-9V35H23v10z' fill='%23252420'/%3E%3C/svg%3E"
    />
    <title>Horse Stacker</title>
  </head>
  <body>
    <!--
      The game is the page. Everything the player sees during a run is drawn by Flight —
      the farm on the 3D canvas, the whole UI on a second 2D canvas above it (src/gameUi2d.ts).
      Only three things stay in the DOM, and each has to: the two canvases are created by
      main.ts, the loading and error panels must be able to show before WebGL exists or when
      it fails, and the status line is the screen-reader's only view of a canvas game.
    -->
    <div class="viewer" id="viewer">
      <div class="panel" id="loading-panel">
        <div class="loader" aria-hidden="true"></div>
        <p id="loading-copy">Rounding up the farm…</p>
      </div>

      <div class="panel" id="error-panel" hidden>
        <p>We couldn’t open the pasture.</p>
        <button type="button" id="retry-button">Try again</button>
      </div>

      <p class="visually-hidden" id="status-copy" role="status">Preparing pasture</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
